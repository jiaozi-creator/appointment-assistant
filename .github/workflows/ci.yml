name: tests-and-build
on:
  pull_request:
  push:
    branches: [main, feat/appointment-assistant-v1]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: appointment
          POSTGRES_DB: appointment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://appointment:appointment@127.0.0.1:5432/appointment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci
      - run: npm test
      - run: node --check server/index.js
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run build
